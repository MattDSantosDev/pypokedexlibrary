[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pokepydex"
version = "0.1.0"
description = "A user-friendly Pokedex using PokeAPI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31,<3",
]

[project.optional-dependencies]
app = [
    "streamlit>=1.35,<2",
    "pandas>=2,<3",
]
test = [
    "pytest>=8,<9",
    "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
include = ["PokePyDex*"]

[tool.ruff.lint]
ignore = ["N999"]