name: Keep Render App Awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping-render:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Render application
        env:
          RENDER_APP_URL: ${{ secrets.RENDER_APP_URL }}
        run: |
          test -n "$RENDER_APP_URL"
          curl --fail --silent --show-error --location \
            --max-time 30 \
            --retry 2 \
            --retry-delay 5 \
            "$RENDER_APP_URL" \
            --output /dev/null
          echo "Render application responded successfully."
